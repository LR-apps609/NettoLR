# Foto dell'app di versioni passate, per le «Bozze Grafiche» del Documento della verità.
# Si avvia a mano con l'elenco dei commit; ogni commit fa il suo giro di foto e le lascia come allegato.
# Non tocca il ramo «screenshots».
name: Foto delle versioni

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Elenco JSON dei commit, es. ["abc1234","def5678"]'
        required: true
      mac:
        description: "Mac di GitHub (se gli arm64 sono pieni: macos-15-intel o macos-14)"
        default: macos-15
        required: false

permissions:
  contents: read

jobs:
  foto:
    runs-on: ${{ inputs.mac || 'macos-15' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(inputs.commit) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.commit }}

      - name: Xcode più recente disponibile
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Progetto
        run: brew install xcodegen && xcodegen generate

      - name: Giro delle foto
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+[^()]*" | head -n 1 | sed 's/ *$//')
          echo "Simulatore: $SIM"
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b > /dev/null 2>&1 || true
          mkdir -p screenshots
          xcodebuild test -project NettoLR.xcodeproj -scheme NettoLRUITests -only-testing:NettoLRUITests/ScreenshotTests \
            -destination "platform=iOS Simulator,name=$SIM" -derivedDataPath build-ui \
            CODE_SIGNING_ALLOWED=NO TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" > ui.log 2>&1 || true
          grep -E "Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)" ui.log | sort -u | head -n 20 || true
          if ! ls screenshots/*.png >/dev/null 2>&1; then
            RESULT=$(ls -d build-ui/Logs/Test/*.xcresult 2>/dev/null | head -n 1)
            if [ -n "$RESULT" ]; then
              xcrun xcresulttool export attachments --path "$RESULT" --output-path attachments || true
              python3 - <<'PY'
          import json, shutil, pathlib
          src = pathlib.Path("attachments"); out = pathlib.Path("screenshots")
          try:
              for test in json.loads((src / "manifest.json").read_text()):
                  for a in test.get("attachments", []):
                      name = a.get("suggestedHumanReadableName", a["exportedFileName"]).split("_")[0]
                      if not name[:1].isdigit(): continue   # solo le foto numerate, non i registri
                      shutil.copy(src / a["exportedFileName"], out / (name if name.endswith(".png") else name + ".png"))
          except Exception as e:
              print("allegati non letti:", e)
          PY
            fi
          fi
          echo "::notice::Foto di ${{ matrix.commit }}: $(ls screenshots/*.png 2>/dev/null | wc -l | tr -d ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: foto-${{ matrix.commit }}
          path: screenshots/*.png
          retention-days: 30
