# Le sequenze di prova (UITests/SequenzeTests.swift) su più iPhone: il più piccolo, uno medio e il più grande
# disponibili sul Mac di GitHub. Parte a mano, o con «[dispositivi]» nel messaggio della modifica.
name: Prova su più iPhone

on:
  push:
    paths-ignore: ["docs/**", "**.md", "sito/**", "installa.sh", ".github/workflows/foto-versioni.yml", ".github/workflows/foto-ramo.yml", ".github/workflows/tester.yml"]
  workflow_dispatch:

# Una prova già partita non si ferma per una modifica nuova: si mettono in fila
concurrency:
  group: dispositivi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prova:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dispositivi]')
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        taglia: [piccolo, medio, grande]
    steps:
      - uses: actions/checkout@v5

      - name: Xcode più recente disponibile
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Progetto
        run: brew install xcodegen && xcodegen generate

      - name: Scelta dell'iPhone
        id: sim
        run: |
          ELENCO=$(xcrun simctl list devices available | grep -oE "iPhone [^()]*" | sed 's/ *$//' | sort -u)
          echo "iPhone disponibili:"; echo "$ELENCO"
          case "${{ matrix.taglia }}" in
            piccolo) SIM=$(echo "$ELENCO" | grep -E "SE|mini|16e" | head -n 1) ;;
            grande)  SIM=$(echo "$ELENCO" | grep -E "Pro Max" | sort -V | tail -n 1)
                     [ -z "$SIM" ] && SIM=$(echo "$ELENCO" | grep -E "Plus|Air" | sort -V | tail -n 1) ;;
            *)       SIM=$(echo "$ELENCO" | grep -E "^iPhone [0-9]+$" | sort -V | tail -n 1) ;;
          esac
          [ -z "$SIM" ] && SIM=$(echo "$ELENCO" | head -n 1)
          echo "::notice::${{ matrix.taglia }}: $SIM"
          echo "nome=$SIM" >> "$GITHUB_OUTPUT"

      - name: Sequenze di prova
        run: |
          SIM="${{ steps.sim.outputs.nome }}"
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b > /dev/null 2>&1 || true
          status=0
          xcodebuild test -project NettoLR.xcodeproj -scheme NettoLRUITests -only-testing:NettoLRUITests/SequenzeTests \
            -destination "platform=iOS Simulator,name=$SIM" -derivedDataPath build-ui -resultBundlePath risultato.xcresult \
            CODE_SIGNING_ALLOWED=NO > ui.log 2>&1 || status=$?
          grep -E "Test Case .*(passed|failed)|Executed .* tests" ui.log | sort -u | while IFS= read -r l; do echo "::notice::$SIM · ${l:0:300}"; done
          grep -E "error:|failed -|XCTAssert" ui.log | sort -u | head -n 20 | while IFS= read -r l; do echo "::error::$SIM · ${l:0:400}"; done
          exit $status

      - name: Risultato e foto degli errori
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prova-${{ matrix.taglia }}
          path: |
            ui.log
            risultato.xcresult
          retention-days: 7
