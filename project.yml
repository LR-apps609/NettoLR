name: NettoLR
options:
  bundleIdPrefix: it.ledion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it

# Versione unica (si legge in Tu, in fondo)
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  NettoLR:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: NOVITA.txt
        buildPhase: resources
      # Le regole fiscali dell'anno (aliquote, soglie, scadenze, fonti): le stesse servono al sito
      - path: Resources/Rules
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: NettoLR
        CFBundleName: NettoLR
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: it.ledion.NettoLR
            CFBundleURLSchemes: [nettolr]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHumanReadableCopyright: "LR apps"
        NSCameraUsageDescription: "NettoLR legge il codice ATECO dal certificato della partita IVA che fotografi. La foto resta sul telefono."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.NettoLR
        PRODUCT_NAME: NettoLR
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # Test automatici del motore di calcolo: girano sul Mac di GitHub a ogni modifica
  NettoLRTests:
    type: bundle.unit-test
    platform: iOS
    # Il codice dell'app compilato direttamente nei test (tranne il punto d'ingresso)
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "Main.swift"
          - "Info.plist"
      - path: Resources/Rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.NettoLRTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

  # Giro dell'app nel simulatore con le foto di ogni schermata
  NettoLRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: NettoLR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.NettoLRUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: NettoLR

schemes:
  NettoLR:
    build:
      targets:
        NettoLR: all
    run:
      config: Debug
    archive:
      config: Release
  NettoLRTests:
    build:
      targets:
        NettoLRTests: [test]
    test:
      config: Debug
      targets:
        - NettoLRTests
  NettoLRUITests:
    build:
      targets:
        NettoLR: all
        NettoLRUITests: [test]
    test:
      config: Debug
      targets:
        - NettoLRUITests
